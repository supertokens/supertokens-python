kind: Fixed
body: 'accountlinking: sign in on a tenant no longer fails with "You have found a bug" when a primary user shared with that tenant has a matching login method of the same recipe only on another tenant. Login methods outside the current tenant are no longer treated as the authenticating login method, so for passwordless consume_code_post and third party sign_in_up_post such a sign in is now handled as a sign up (sign up checks apply), while emailpassword and webauthn sign_in_post return WRONG_CREDENTIALS_ERROR and INVALID_CREDENTIALS_ERROR. Or, with a session from that primary user, the login method''s recipe user is associated with the current tenant when its credentials are valid on its own tenant. If another user of the current tenant already holds some of that login method''s account info, the login method is skipped instead of retrying until the request fails. Passwordless createCode uses the same tenant check, so it agrees with consumeCode on sign in versus sign up'
time: 2026-11-08T15:00:00.000000+05:30
