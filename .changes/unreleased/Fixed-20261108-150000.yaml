kind: Fixed
body: 'accountlinking: sign in on a tenant no longer fails with "You have found a bug" when a primary user shared with that tenant has a matching login method of the same recipe only on another tenant. Login methods outside the current tenant are no longer treated as the authenticating login method, so such a sign in is now handled as a sign up (sign up checks apply), or, with a session from that primary user, the login method''s recipe user is associated with the current tenant when its credentials are valid on its own tenant'
time: 2026-11-08T15:00:00.000000+05:30
