kind: Changed
body: 'session: access tokens whose payload has an `stt` claim other than `0` are now rejected, and `stt` can no longer be set as a custom claim in the access token payload. If your code sets a custom access token claim named `stt`, rename it before upgrading. Existing sessions that carry such a claim are rejected with a 401 and can''t be refreshed or signed out until they are repaired: repair them with `merge_into_access_token_payload(session_handle, {})`, which removes the now-protected claim, or revoke them.'
