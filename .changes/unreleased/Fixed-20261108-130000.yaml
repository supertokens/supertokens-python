kind: Fixed
body: 'session: fetching JWKS from the core during async session verification no longer blocks the event loop; the fetch now runs in a worker thread, and concurrent requests on the same event loop share one fetch. Each of them gets the keys that fetch returned, as with the sync API, so this also works with jwks_refresh_interval_sec=0'
