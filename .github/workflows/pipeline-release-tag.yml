name: "Release Pipeline"

# Thin caller of the shared reusable release-tag workflow in supertokens/actions.
# The shared five-job release skeleton (setup, register-version, mark-as-success,
# release, merge — including the post-release dev sync) lives once in the
# reusable workflow; only python's ecosystem follow-ups (docs publish + PyPI
# publish) remain here and consume the reusable workflow's outputs via `needs`.
#
# The one behaviour change vs. the previous per-repo copy is inherited from the
# shared workflow (see supertokens/actions .github/workflows/release-tag.yml):
# the git tag is pushed BEFORE the API "release: true" PATCH — the tag is the
# release, so the API mark follows reality. Everything else (register-version,
# the post-release dev sync, the changelog commit, the GitHub release) matches
# python's previous copy, which was already the baseline for the shared workflow.
#
# The previous copy's inline "Constants version and setup version mismatch"
# guard in the setup step has moved into hooks/populate-hook-constants.sh (the
# reusable setup job sources it), per the shared version-hook contract.
#
# These release paths only run when a dev-sync release PR (release/vX.Y.Z) is
# merged into a version branch, or on manual dispatch — CI on a normal PR cannot
# exercise them.

on:
  # Auto-trigger when a dev-sync release PR is merged into a version branch.
  pull_request:
    types: [closed]
    branches:
      - '[0-9]+.[0-9]+'

  # Manual trigger for overrides (skip checks, hotfixes, etc.)
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to create the release tag on
        type: string
        required: true

      skip-test-checks:
        description: Skip tests passed checks
        type: boolean
        default: false
        required: false

      skip-other-version-checks:
        description: Skip server checks for core and frontend versions
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  pull-requests: read

jobs:
  release-pipeline:
    uses: supertokens/actions/.github/workflows/release-tag.yml@main
    secrets: inherit
    with:
      sdk_name: python
      branch: ${{ inputs.branch || '' }}
      skip-test-checks: ${{ inputs.skip-test-checks || false }}
      skip-other-version-checks: ${{ inputs.skip-other-version-checks || false }}
      # Must cover every .changie.yaml replacement target so the release
      # changelog commit stages the bumped version files.
      changelog_add_paths: ".changes/ CHANGELOG.md setup.py supertokens_python/constants.py"

  publish-docs:
    runs-on: ubuntu-latest
    needs:
      - release-pipeline

    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: supertokens
          # This job checks out and dispatches a workflow in
          # supertokens-backend-website in addition to this repo.
          repositories: |
            ${{ github.event.repository.name }}
            supertokens-backend-website

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-pipeline.outputs.releaseTag }}
          fetch-tags: true
          path: supertokens-python

      - uses: actions/checkout@v4
        with:
          repository: supertokens/supertokens-backend-website
          token: ${{ steps.app-token.outputs.token }}
          path: supertokens-backend-website

      - run: |
          shopt -s extglob # Enable extended globbing

          if [[ "${{ needs.release-pipeline.outputs.isLatest }}" == "true" ]]
          then
            # Delete everything except the version folders
            rm -rf supertokens-backend-website/app/docs/sdk/docs/python/!(*.*.X)
            # Copy files to the root dir
            cp -r supertokens-python/html/supertokens_python/* supertokens-backend-website/app/docs/sdk/docs/python/
          fi

          # Delete the current version folder if it exists
          rm -rf supertokens-backend-website/app/docs/sdk/docs/python/${{ needs.release-pipeline.outputs.versionXy }}.X
          # Copy the current docs
          mkdir -p supertokens-backend-website/app/docs/sdk/docs/python/${{ needs.release-pipeline.outputs.versionXy }}.X
          cp -r supertokens-python/html/supertokens_python/* supertokens-backend-website/app/docs/sdk/docs/python/${{ needs.release-pipeline.outputs.versionXy }}.X

      - uses: actions/upload-artifact@v4
        with:
          name: python-docs-${{ needs.release-pipeline.outputs.version }}
          path: supertokens-backend-website/app/docs/sdk/docs/python

      - name: Trigger the backend website CI
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            github.rest.actions.createWorkflowDispatch({
                owner: 'supertokens',
                repo: 'supertokens-backend-website',
                workflow_id: 'release-python-documentation-changes.yml',
                ref: 'master',
                inputs: {
                  "version": `${{ needs.release-pipeline.outputs.version }}`,
                  "artifact-name": `python-docs-${{ needs.release-pipeline.outputs.version }}`,
                  "version-folder": `app/docs/sdk/docs/python`,
                  "run-id": `${{ github.run_id }}`,
                  "stage":  "production",
                }
              })

  publish:
    runs-on: ubuntu-latest
    environment: publish
    needs:
      - release-pipeline

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-pipeline.outputs.releaseTag }}
          fetch-tags: true

      - run: |
          python3 -m pip install pip setuptools packaging poetry clikit --upgrade
          make dev-install
          pip install setuptools wheel twine
          python setup.py sdist bdist_wheel
          twine upload -u ${{ secrets.TWINE_USERNAME }} -p ${{ secrets.TWINE_PASSWORD }} dist/*
